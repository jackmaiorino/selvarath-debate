  </g>
  <g id="text_14">
   <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #7663a6" x="692.424" y="234.699807" transform="rotate(-0 692.424 234.699807)">+0.84 pp</text>
  </g>
  <g id="text_15">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #4d5d67" x="692.424" y="256.175257" transform="rotate(-0 692.424 256.175257)">Holm p = 0.351</text>
  </g>
  <g id="text_16">
   <text style="font-weight: 700; font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1c303c" x="46.728" y="32.256" transform="rotate(-0 46.728 32.256)">Phase 4B recipient comparison</text>
  </g>
  <g id="text_17">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #556773" x="46.728" y="55.7568" transform="rotate(-0 46.728 55.7568)">656 matched units · 82 questions · 5,248 completed verdicts</text>
  </g>
  <g id="text_18">
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #556773" x="46.728" y="82.0224" transform="rotate(-0 46.728 82.0224)">Positive pooled benefit means fewer errors after label repair. Positive difference means a larger benefit for Qwen.</text>
  </g>
  <g id="text_19">
   <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #344652" x="46.728" y="377.3952" transform="rotate(-0 46.728 377.3952)">Neither primary contrast meets both the statistical and practical gates. This does not establish equivalence.</text>
  </g>
  <g id="text_20">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #556773" x="46.728" y="403.2" transform="rotate(-0 46.728 403.2)">Exact practical magnitude gates: 79/2624 = 3.01 pp (pooled); 40/1312 = 3.05 pp (recipient difference).</text>
  </g>
  <g id="text_21">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #556773" x="46.728" y="422.0928" transform="rotate(-0 46.728 422.0928)">Intervals: 10,000 world-stratified paired question bootstrap replicates. Holm p values use the two-contrast family.</text>
  </g>
  <g id="text_22">
   <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #71818c" x="46.728" y="442.368" transform="rotate(-0 46.728 442.368)">Frozen analysis · 12 Sep 2026 · Source review used AI; independent human validation was not performed.</text>
  </g>
