  <g id="text_12">
   <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #7663a6" x="46.728" y="236.313963" transform="rotate(-0 46.728 236.313963)">Recipient difference</text>
